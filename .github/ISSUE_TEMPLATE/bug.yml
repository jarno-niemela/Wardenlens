name: Bug
description: Something does not work as intended
labels: ["type:bug", "status:backlog", "needs:triage"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened vs what was expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version / commit }
