name: Epic
description: A large body of work that will be split into tasks
title: "[Epic] "
labels: ["type:epic", "status:backlog", "needs:triage"]
body:
  - type: textarea
    id: goal
    attributes: { label: Goal, description: The outcome and why it matters }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Scope, description: In scope / out of scope }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, value: "- [ ] " }
    validations: { required: true }
