# Daily neglect check. Maintains a single "Ticket audit report" issue, created by this workflow.
name: ticket-audit
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Ticket audit report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Run audit and upsert report issue
        run: |
          findings=$(scripts/ticket-audit --json --fail-on never)
          report=$(scripts/ticket-audit --fail-on never)
          # Only the bot's own report counts, matched on the exact title.
          existing=$(gh issue list --state open --author app/github-actions --search "in:title \"$TITLE\"" \
            --json number,title --jq "map(select(.title == env.TITLE)) | first | .number // empty")
          if jq -e 'any(.[]; .severity == "error" or .severity == "warn") | not' <<<"$findings" >/dev/null; then
            if [[ -n "$existing" ]]; then
              scripts/ticket status "$existing" done
              gh issue close "$existing" --comment "Audit clean on $(date -u +%F)."
            fi
            exit 0
          fi
          # Indented code block: ticket titles are untrusted and cannot break out of it.
          body=$(printf 'Automated daily audit (%s). Run `/ticket-audit` to fix. This issue is not a work item.\n\n%s\n' \
            "$(date -u +%F)" "$(sed 's/^/    /' <<<"$report")")
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label "type:chore,status:backlog,agent:human,needs:triage" --body "$body"
          fi
