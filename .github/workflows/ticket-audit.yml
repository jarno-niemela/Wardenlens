# Daily neglect check. Maintains a single "Ticket audit report" issue.
name: ticket-audit
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Ticket audit report
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Run audit and upsert report issue
        run: |
          report=$(scripts/ticket-audit --fail-on never)
          existing=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | first | .number // empty")
          if [[ "$report" == "ticket-audit: clean" ]]; then
            [[ -n "$existing" ]] && gh issue close "$existing" --comment "Audit clean on $(date -u +%F)."
            exit 0
          fi
          body=$(printf 'Automated daily audit (%s). Run `/ticket-audit` to fix.\n\n```\n%s\n```\n' "$(date -u +%F)" "$report")
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --label "type:chore,status:ready,priority:p1" --body "$body"
          fi
