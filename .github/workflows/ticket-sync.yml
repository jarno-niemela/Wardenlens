# Keeps issue status:* labels in step with issue and PR events.
#
# PR events use pull_request_target: the workflow definition and the checked-out scripts both come
# from the default branch, never from the PR head, so a PR cannot alter how its own labels are
# synced. The PR's title/body are untrusted: they only reach the shell through environment
# variables, are parsed with fixed patterns and are never executed or checked out.
name: ticket-sync
on:
  issues:
    types: [closed, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT: ${{ github.event_name }}
      ACTION: ${{ github.event.action }}
      ISSUE: ${{ github.event.issue.number }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_DRAFT: ${{ github.event.pull_request.draft }}
      PR_MERGED: ${{ github.event.pull_request.merged }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync labels
        run: |
          # Closing references are taken from the PR body only (GitHub ignores titles): the keywords
          # close/fix/resolve (any tense) followed by #N, owner/repo#N or an issue URL.
          refs() {
            printf '%s\n' "$PR_BODY" | tr -d '\r' \
              | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*(https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/issues/|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#|#)[0-9]+' \
              | while read -r m; do
                  # references into other repositories do not concern this one
                  if [[ "$m" == */* && "${m,,}" != *"${REPO,,}"* ]]; then continue; fi
                  grep -oE '[0-9]+$' <<<"$m"
                done | sort -u
          }
          is_open() { [[ "$(gh issue view "$1" --json state --jq .state 2>/dev/null)" == OPEN ]]; }
          each_open() {  # each_open STATE: set STATE on every open issue the PR closes
            local n
            for n in $(refs); do
              if is_open "$n"; then scripts/ticket status "$n" "$1"; fi
            done
          }
          case "$EVENT:$ACTION" in
            issues:closed)   scripts/ticket status "$ISSUE" done ;;
            issues:reopened) scripts/ticket status "$ISSUE" ready ;;
            pull_request_target:converted_to_draft) each_open in-progress ;;
            pull_request_target:opened|pull_request_target:reopened|pull_request_target:ready_for_review)
              if [[ "$PR_DRAFT" != true ]]; then each_open in-review; fi ;;
            pull_request_target:closed)
              # a merge closes the issue, and the issues:closed event marks it done
              if [[ "$PR_MERGED" != true ]]; then each_open ready; fi ;;
          esac
