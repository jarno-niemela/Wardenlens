[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
repository = "https://github.com/jarno-niemela/Wardenlens"

[workspace.dependencies]
wardenlens-core = { path = "crates/wardenlens-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics are bugs in library code: return errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "deny"
# Lint suppressions must be #[expect(lint, reason = "...")]: justified, and flagged when stale.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
undocumented_unsafe_blocks = "deny"
# Noisy pedantic lints we deliberately accept.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
