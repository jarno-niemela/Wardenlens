[package]
name = "wardenlens-api"
description = "HTTP API for Wardenlens: axum router, bearer-token authentication and the OpenAPI document."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# Versions and features follow ADR 0004 section 10.
[dependencies]
wardenlens-core = { workspace = true }
thiserror = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = { version = "0.5.3", default-features = false, features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7.1", default-features = false, features = ["trace", "sensitive-headers", "limit", "timeout"] }
tracing = "0.1.44"
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
subtle = "2.6.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
getrandom = "0.4.3"
# #62 (ADR 0004 section 9): the streamed download. `rt` for spawn and spawn_blocking, `sync` for the
# pump channel and the download semaphore, `time` for the idle timeout; no `fs` or `io-util`.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time"] }
# Already in the tree through axum; the body type of the streamed download implements its trait.
http-body = { version = "1.1.0", default-features = false }

[dev-dependencies]
wardenlens-core = { workspace = true, features = ["test-support"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "test-util"] }
tempfile = { workspace = true }
http-body-util = "0.1.5"
secrecy = { workspace = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
