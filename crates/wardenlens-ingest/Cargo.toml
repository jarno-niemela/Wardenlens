[package]
name = "wardenlens-ingest"
description = "RTSP/TCP ingest: one H.264 video stream per session as timestamped AVCC frames."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# ADR 0002 picks retina; ADR 0004 section 8 lets ingest depend on core only. `h265` is off: the
# codec is refused with `UnsupportedCodec`, so its depacketizer is dead weight.
[dependencies]
wardenlens-core.workspace = true
thiserror.workspace = true
secrecy.workspace = true
retina = { version = "0.4.22", default-features = false }
# retina's `describe` takes a `url::Url`; the same major version retina uses.
url = { version = "2.5", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
proptest.workspace = true
# Independent SPS parser (the one retina itself uses), only as a test oracle for `sps`.
h264-reader = "0.9.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "net", "io-util", "test-util", "sync"] }

[lints]
workspace = true
