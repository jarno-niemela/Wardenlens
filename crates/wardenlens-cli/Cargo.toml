[package]
name = "wardenlens-cli"
description = "Command-line entry point for Wardenlens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "wardenlens"
path = "src/main.rs"

[dependencies]
aho-corasick = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
rustix = { workspace = true, features = ["termios", "process"] }
secrecy.workspace = true
serde_json = "1"
thiserror = { workspace = true }
# ADR 0004 section 9: the hand-written accept loop (`serve`), not `axum::serve`.
hyper = { version = "1.12.0", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-auto", "server-graceful", "service", "tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
wardenlens-agentdvr = { path = "../wardenlens-agentdvr" }
wardenlens-api = { path = "../wardenlens-api" }
wardenlens-core.workspace = true
wardenlens-fsutil = { path = "../wardenlens-fsutil" }
wardenlens-ingest = { path = "../wardenlens-ingest" }
wardenlens-recorder = { path = "../wardenlens-recorder" }
wardenlens-storage = { path = "../wardenlens-storage" }
wardenlens-index = { path = "../wardenlens-index" }
wardenlens-secrets = { path = "../wardenlens-secrets" }
wardenlens-vault = { path = "../wardenlens-vault" }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }
# Tests drive the real accept loop with raw sockets, and build the storage loop on one filesystem.
tokio = { version = "1.54.1", default-features = false, features = ["io-util"] }
wardenlens-storage = { path = "../wardenlens-storage", features = ["test-support"] }

[lints]
workspace = true
