[package]
name = "wardenlens-cli"
description = "Command-line entry point for Wardenlens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "wardenlens"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rustix = { workspace = true, features = ["termios"] }
secrecy = "0.10"
serde_json = "1"
thiserror = { workspace = true }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
wardenlens-core.workspace = true
wardenlens-secrets = { path = "../wardenlens-secrets" }
wardenlens-vault = { path = "../wardenlens-vault" }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
