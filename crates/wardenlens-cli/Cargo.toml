[package]
name = "wardenlens-cli"
description = "Command-line entry point for Wardenlens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "wardenlens"
path = "src/main.rs"

[dependencies]
aho-corasick = { workspace = true }
clap = { version = "4", features = ["derive"] }
rustix = { workspace = true, features = ["termios"] }
secrecy.workspace = true
serde_json = "1"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
wardenlens-agentdvr = { path = "../wardenlens-agentdvr" }
wardenlens-core.workspace = true
wardenlens-fsutil = { path = "../wardenlens-fsutil" }
wardenlens-index = { path = "../wardenlens-index" }
wardenlens-secrets = { path = "../wardenlens-secrets" }
wardenlens-vault = { path = "../wardenlens-vault" }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
