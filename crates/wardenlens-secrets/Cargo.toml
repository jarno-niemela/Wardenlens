[package]
name = "wardenlens-secrets"
description = "Sensitive-data cipher: XChaCha20-Poly1305 records and key-file handling. No SQLite, no scan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"] }
secrecy = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
