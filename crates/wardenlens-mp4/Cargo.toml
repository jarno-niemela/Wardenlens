[package]
name = "wardenlens-mp4"
description = "Fragmented MP4 (fMP4) writer for H.264 passthrough. No I/O beyond std::io::Write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The sample bound comes from the parser's payload cap (`core::mp4box`), so they cannot drift.
wardenlens-core = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = { workspace = true }

[lints]
workspace = true
