vendor = "TP-Link"
model = "Tapo C110"
support = "partial"
firmware = ["1.5"]
quirks = [
  "ONVIF PullMessages with Timeout=PT10S returns an empty reply; PT5S works.",
  "ONVIF needs the Camera Account created in the Tapo app, not the cloud account.",
  "The local HTTPS API needs the cloud account password; Wardenlens does not use it.",
  "Person and motion notifications have not been observed live, only advertised by GetEventProperties.",
  "Camera RTP timestamps are jittery; use an own arrival clock.",
]

[[streams]]
role = "main"
codec = "h264"
width = 1920
height = 1080
fps = 15.0
gop = 30

[[streams]]
role = "sub"
codec = "h264"
width = 640
height = 360
fps = 15.0
gop = 30

[[protocols]]
kind = "rtsp"
paths = ["/stream1", "/stream2"]

[[protocols]]
kind = "onvif"
port = 2020

[[protocols]]
kind = "tapo_https"
port = 443

