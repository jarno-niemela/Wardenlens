vendor = "Dahua"
model = "IPC-HFW4431R-Z"
aliases = ["XR"]
support = "partial"
quirks = [
  "ONVIF was not exercised in depth; its capabilities are unconfirmed. Video and the CGI motion events were verified.",
  "The heartbeat parameter of the eventManager attach call was not honoured; detect a dead connection with TCP keepalive and a read timeout.",
  "AI person and vehicle events are not offered on the tested firmware; only classic motion detection.",
  "eventManager getCaps and devVideoAnalyse getCaps return Invalid Request on the tested firmware.",
  "Camera RTP timestamps are jittery on the sub stream; use an own arrival clock.",
]

[[streams]]
role = "main"
codec = "h264"
width = 2560
height = 1440
fps = 25.0
gop = 50

[[streams]]
role = "sub"
codec = "h264"
width = 704
height = 576
fps = 25.0
gop = 50

[[protocols]]
kind = "rtsp"
# The first two are the main and sub stream (the order `camera add` relies on). The last two are
# the forms Dahua's ONVIF GetStreamUri answers with (see the evidence entry below); an ONVIF
# answer is accepted only when its query is exactly one of these (SEC-10).
paths = ["/cam/realmonitor?channel=1&subtype=0", "/cam/realmonitor?channel=1&subtype=1", "/cam/realmonitor?channel=1&subtype=0&unicast=true&proto=Onvif", "/cam/realmonitor?channel=1&subtype=1&unicast=true&proto=Onvif"]

[[protocols]]
kind = "dahua_cgi"

[[protocols]]
kind = "onvif"
port = 80

[[events]]
kind = "motion"
source = "cgi"
status = "observed"

[[events]]
kind = "client_disconnect"
source = "cgi"
status = "observed"

[[evidence]]
reference = "docs/adr/0002-camera-integration.md"
section = "3. Dahua"

[[evidence]]
reference = "docs/adr/0002-camera-integration.md"
section = "1. Two-client RTSP tolerance"

[[evidence]]
reference = "#218"
section = "Dahua ONVIF GetStreamUri form, per Dahua Technology support documentation (vendor material, not re-fetched): rtsp://<ip>:554/cam/realmonitor?channel=1&subtype=<0|1>&unicast=true&proto=Onvif"
